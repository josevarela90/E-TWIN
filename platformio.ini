[platformio]
default_envs = master_core2, slave_energy, slave_vibration
src_dir = firmware

[env]
platform = espressif32 @ 6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  m5stack/M5GFX @ 0.2.34
  m5stack/M5Unified @ 0.2.7
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_LOOP_STACK_SIZE=16384
  -Wall

[env:master_core2]
board = m5stack-core2
build_src_filter = +<master_core2.cpp>
board_build.partitions = default_8MB.csv
lib_deps =
  ${env.lib_deps}
  knolleary/PubSubClient @ 2.8

[s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

[env:slave_energy]
extends = s3
build_src_filter = +<slave_energy.cpp>
lib_deps =
  ${env.lib_deps}
  mandulaj/PZEM-004T-v30 @ 1.1.2

[env:slave_vibration]
extends = s3
build_src_filter = +<slave_vibration.cpp>
