>V · I · P · E · f · FP</text><text x="350" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#153346" text-anchor="start">TX → G2 / RX ← G1</text><text x="350" y="454" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#153346" text-anchor="start">UART / Modbus RTU</text><rect x="325" y="523" width="405" height="139" rx="16" fill="white" stroke="#cbd8e0" stroke-width="2"/><text x="350" y="566" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" fill="#153346" text-anchor="start">ATOMS3 Lite</text><text x="350" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">Lectura eléctrica ≈ 1 Hz</text><polyline points="527,477 527,523" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="275,453 297,453 297,382 325,382" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="325" y="721" width="405" height="235" rx="16" fill="white" stroke="#cbd8e0" stroke-width="2"/><text x="350" y="765" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#153346" text-anchor="start">ATOMS3 + MPU6886</text><text x="350" y="810" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#153346" text-anchor="start">500 Hz · 500 muestras</text><text x="350" y="847" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#153346" text-anchor="start">Filtro digital: 6–75 Hz</text><text x="350" y="884" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#153346" text-anchor="start">RMS por eje / total</text><text x="350" y="921" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#153346" text-anchor="start">Pico · cresta · calidad</text><polyline points="275,668 298,668 298,837 325,837" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1047" y="303" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#087d88" text-anchor="middle">ESP-NOW · 2,4 GHz</text><rect x="825" y="355" width="445" height="490" rx="16" fill="white" stroke="#cbd8e0" stroke-width="2"/><text x="852" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#153346" text-anchor="start">M5 Core2</text><text x="852" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">Autenticación y vigencia</text><text x="852" y="506" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">Análisis eléctrico + vibración</text><text x="852" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">Referencia: 10 pares válidos</text><text x="852" y="602" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">HMI táctil: 4 pantallas</text><text x="852" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">Caducidad de datos: 5 s</text><rect x="850" y="730" width="395" height="81" rx="12" fill="#e7f4f1" stroke="#b6d9d1" stroke-width="2"/><text x="1047" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#153346" text-anchor="middle">Proceso · energía · vibración</text><text x="1047" y="794" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#153346" text-anchor="middle">Red / seguridad OT</text><polyline points="730,590 825,590" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="730,836 780,836 780,675 825,675" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1047" y="901" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#153346" text-anchor="middle">Unicast: AES-CCMP + HMAC</text><text x="1047" y="939" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#4d6473" text-anchor="middle">Baliza: HMAC, sin cifrado</text><rect x="1410" y="354" width="510" height="222" rx="16" fill="white" stroke="#cbd8e0" stroke-width="2"/><text x="1438" y="402" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#153346" text-anchor="start">ThingSpeak</text><text x="1438" y="450" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">8 campos + estado ampliado</text><text x="1438" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">Histórico de telemetría</text><text x="1438" y="536" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="start">Una publicación cada 20 s</text><polyline points="1270,530 1410,530" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1353" y="301" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#215da4" text-anchor="start">Salida Wi-Fi: MQTT / TLS</text><text x="1353" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#215da4" text-anchor="start">Puerto 8883 · QoS 0</text><polyline points="1665,576 1665,713" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1490" y="611" width="350" height="60" rx="0" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="2"/><text x="1665" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#153346" text-anchor="middle">HTTPS · consulta 20 s</text><rect x="1410"