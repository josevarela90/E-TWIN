<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="650" viewBox="0 0 2000 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#087d88" stroke-width="2"/></marker></defs><rect x="0" y="0" width="2000" height="650" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="35" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#153346" text-anchor="start">Flujo de datos y tratamiento de calidad</text><rect x="35" y="126" width="350" height="230" rx="16" fill="#f4f8fa" stroke="#cbd8e0" stroke-width="2"/><text x="55" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#153346" text-anchor="start">1  Adquirir</text><text x="55" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">PZEM: ≈ 1 Hz</text><text x="55" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">IMU: 500 Hz</text><rect x="430" y="126" width="350" height="230" rx="16" fill="#f4f8fa" stroke="#cbd8e0" stroke-width="2"/><text x="450" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#153346" text-anchor="start">2  Procesar</text><text x="450" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">Filtrar por eje</text><text x="450" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">RMS / pico / calidad</text><rect x="825" y="126" width="350" height="230" rx="16" fill="#f4f8fa" stroke="#cbd8e0" stroke-width="2"/><text x="845" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#153346" text-anchor="start">3  Verificar</text><text x="845" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">MAC + HMAC + sesión</text><text x="845" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">Secuencia + vigencia</text><rect x="1220" y="126" width="350" height="230" rx="16" fill="#f4f8fa" stroke="#cbd8e0" stroke-width="2"/><text x="1240" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#153346" text-anchor="start">4  Analizar</text><text x="1240" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">Reglas y 10 referencias</text><text x="1240" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">HMI local / estados</text><rect x="1615" y="126" width="350" height="230" rx="16" fill="#f4f8fa" stroke="#cbd8e0" stroke-width="2"/><text x="1635" y="174" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#153346" text-anchor="start">5  Publicar</text><text x="1635" y="235" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">MQTT / TLS → nube</text><text x="1635" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#153346" text-anchor="start">HTTPS → SCADA</text><polyline points="385,242 430,242" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="780,242 825,242" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1175,242 1220,242" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1570,242 1615,242" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1000,356 1000,420" fill="none" stroke="#087d88" stroke-width="4" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow)"/><rect x="550" y="420" width="900" height="130" rx="15" fill="#fff7e7" stroke="#ddc791" stroke-width="2"/><text x="1000" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#153346" text-anchor="middle">Dato inválido o antiguo: no utilizarlo en el análisis</text><text x="1000" y="512" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="400" fill="#153346" text-anchor="middle">Mostrar ausencia / espera; nunca sustituirlo por cero</text><text x="35" y="608" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="400" fill="#4d6473" text-anchor="start">La nube conserva resúmenes de ventanas; no recibe la forma de onda de aceleración.</text></svg>